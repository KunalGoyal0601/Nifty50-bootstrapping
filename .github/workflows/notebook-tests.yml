name: Notebook setup tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install notebook dependencies
        run: python -m pip install -r requirements.txt
      - name: Test repository safety and notebook paths
        run: python -m unittest discover -s tests -v
      - name: Create synthetic CI-only data (not real market data)
        run: python tests/create_synthetic_data.py
      - name: Execute notebook with synthetic data
        run: jupyter nbconvert --to notebook --execute bootstrap_nifty50_ci.ipynb --output /tmp/bootstrap_nifty50_ci.executed.ipynb --ExecutePreprocessor.timeout=600
