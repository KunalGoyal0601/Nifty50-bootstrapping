name: Notebook setup tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Execute complete bootstrap notebook
        run: jupyter nbconvert --to notebook --execute bootstrap_nifty50_ci.ipynb --output /tmp/bootstrap_nifty50_ci.executed.ipynb --ExecutePreprocessor.timeout=600
